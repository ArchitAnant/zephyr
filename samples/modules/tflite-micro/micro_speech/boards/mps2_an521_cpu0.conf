# 1. Enable ARM Hardware Floating Point
CONFIG_FPU=y

# 2. Tell the linker to ignore the OpenAMP resource table placement
CONFIG_LINKER_ORPHAN_SECTION_PLACE=y

# 3. Disable NXP-specific hardware bindings
CONFIG_OPENAMP_VENDOR_RSC_TABLE=n

# 4. Logging
CONFIG_LOG=y
CONFIG_PRINTK=y
CONFIG_LOG_PRINTK=y